[package]
name = "helios-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }
helios-client-model = { path = "../../crates/helios-client-model" }
helios-client-control = { path = "../../crates/helios-client-control" }
helios-config = { path = "../../crates/helios-config" }
helios-control = { path = "../../crates/helios-control" }
helios-protocol = { path = "../../crates/helios-protocol" }
helios-routing = { path = "../../crates/helios-routing" }
helios-system-proxy = { path = "../../crates/helios-system-proxy" }
helios-transport = { path = "../../crates/helios-transport" }
quinn.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "time"] }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.21.3"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", features = ["blocking"] }
tproxy-config = { workspace = true, features = ["secure-state-file"] }

[target.'cfg(target_os = "macos")'.dependencies]
tproxy-config = { workspace = true, features = ["secure-state-file"] }
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["block2", "NSAccessibilityProtocols", "NSApplication", "NSAttributedString", "NSBezierPath", "NSColor", "NSFont", "NSFontDescriptor", "NSGraphics", "NSImage", "NSStringDrawing"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSAttributedString", "NSDictionary"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
