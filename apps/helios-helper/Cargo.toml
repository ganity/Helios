[package]
name = "helios-helper"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
helios-config = { path = "../../crates/helios-config" }
hickory-proto.workspace = true
helios-dns = { path = "../../crates/helios-dns" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "process", "io-std"] }
toml.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
tproxy-config = { workspace = true, features = ["secure-state-file"] }
tun2proxy = { version = "=0.8.3", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"
sha2.workspace = true
tun = { version = "=0.8.14", features = ["async"] }
