[package]
name = "helios-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
helios-config = { path = "../../crates/helios-config" }
helios-control = { path = "../../crates/helios-control" }
helios-dns = { path = "../../crates/helios-dns" }
helios-protocol = { path = "../../crates/helios-protocol" }
helios-proxy = { path = "../../crates/helios-proxy" }
helios-routing = { path = "../../crates/helios-routing" }
helios-system-proxy = { path = "../../crates/helios-system-proxy" }
helios-transport = { path = "../../crates/helios-transport" }
getrandom.workspace = true
hickory-proto.workspace = true
quinn.workspace = true
rustls.workspace = true
subtle.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls.workspace = true
bytes = "1.10.1"
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
base64 = "0.22.1"
