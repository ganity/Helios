name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-bin gsettings-desktop-schemas dconf-service dbus-x11 desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - name: Keep failed Linux route cleanup retryable
        run: cargo test -p tproxy-config --features secure-state-file
      - name: Validate Linux desktop entry
        run: desktop-file-validate deploy/helios-client.desktop
      - name: Test isolated GNOME proxy lease and recovery
        run: |
          task_gsettings_dir=$(mktemp -d "$RUNNER_TEMP/helios-gsettings.XXXXXX")
          env XDG_CONFIG_HOME="$task_gsettings_dir" HELIOS_ISOLATED_GSETTINGS_DIR="$task_gsettings_dir" \
            dbus-run-session -- cargo test -p helios-system-proxy isolated_gsettings_lease_round_trip -- --ignored
      - name: Test isolated Linux tray registration and host loss
        run: env HELIOS_ISOLATED_TRAY_TEST=1 dbus-run-session -- cargo test -p helios-client isolated_sni_registration_activation_and_host_loss -- --ignored
      - name: Test desktop-managed daemon proxy recovery
        run: |
          task_proxy_dir=$(mktemp -d "$RUNNER_TEMP/helios-managed-proxy.XXXXXX")
          env XDG_CONFIG_HOME="$task_proxy_dir" HELIOS_ISOLATED_GSETTINGS_DIR="$task_proxy_dir" HELIOS_ISOLATED_PROXY_TEST=1 \
            dbus-run-session -- cargo test -p helios-daemon managed_guard_restores_lease_on_exit_and_on_startup_recovery -- --ignored
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace --release
      - name: Build Debian installer
        run: sh deploy/package-linux-deb.sh target/release target/installers
      - name: Validate Debian installer
        run: |
          dpkg-deb --info target/installers/helios_*.deb
          dpkg-deb --contents target/installers/helios_*.deb
          dpkg-deb --field target/installers/helios_*.deb Depends | grep -q 'libwayland-client0'
      - name: Upload Linux installer
        uses: actions/upload-artifact@v4
        with:
          name: helios-linux-deb
          if-no-files-found: error
          path: target/installers/helios_*.deb

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p helios-daemon -p helios-client -p helios-helper -p heliosctl
      - name: Reject missing and corrupt TUN recovery records
        run: cargo test -p tproxy-config --features secure-state-file recovery_rejects_missing_or_corrupt_secure_record
      - run: cargo test -p helios-helper
      - run: cargo test -p tproxy-config --features secure-state-file recovery_record_
      - run: cargo clippy -p helios-daemon -p helios-client -p helios-helper -p heliosctl --all-targets -- -D warnings
      - name: Build workspace release binaries
        run: cargo build --workspace --release --locked
      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          New-Item -ItemType Directory -Force target/installer | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp /Otarget\installer deploy\helios-windows.iss
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: helios-windows-installer
          if-no-files-found: error
          path: target/installer/Helios-Setup-x64.exe

  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test native TCP socket setup and TLS transport
        run: |
          cargo test -p helios-transport tls::tests:: -- --nocapture
      - run: cargo check -p helios-daemon -p helios-client -p helios-helper -p heliosctl
      - name: Reject missing and corrupt TUN recovery records
        run: cargo test -p tproxy-config --features secure-state-file recovery_rejects_missing_or_corrupt_secure_record
      - run: cargo test -p helios-helper
      - run: cargo test -p tproxy-config --features secure-state-file recovery_record_
      - run: cargo clippy -p helios-daemon -p helios-client -p helios-helper -p heliosctl --all-targets -- -D warnings
      - name: Build workspace release binaries
        run: cargo build --workspace --release --locked
      - name: Build macOS DMG installer
        run: sh deploy/package-macos-app.sh target/release target/installers "$(cargo pkgid -p helios-client | sed 's/.*@//')"
      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: helios-macos-${{ matrix.arch }}-dmg
          if-no-files-found: error
          path: target/installers/Helios-macos-${{ matrix.arch }}.dmg
