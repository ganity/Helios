name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-bin gsettings-desktop-schemas dconf-service dbus-x11 desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - name: Keep failed Linux route cleanup retryable
        run: cargo test -p tproxy-config --features secure-state-file
      - name: Validate Linux desktop entry
        run: desktop-file-validate deploy/helios-client.desktop
      - name: Test isolated GNOME proxy lease and recovery
        run: |
          task_gsettings_dir=$(mktemp -d "$RUNNER_TEMP/helios-gsettings.XXXXXX")
          env XDG_CONFIG_HOME="$task_gsettings_dir" HELIOS_ISOLATED_GSETTINGS_DIR="$task_gsettings_dir" \
            dbus-run-session -- cargo test -p helios-system-proxy isolated_gsettings_lease_round_trip -- --ignored
      - name: Test isolated Linux tray registration and host loss
        run: env HELIOS_ISOLATED_TRAY_TEST=1 dbus-run-session -- cargo test -p helios-client isolated_sni_registration_activation_and_host_loss -- --ignored
      - name: Test desktop-managed daemon proxy recovery
        run: |
          task_proxy_dir=$(mktemp -d "$RUNNER_TEMP/helios-managed-proxy.XXXXXX")
          env XDG_CONFIG_HOME="$task_proxy_dir" HELIOS_ISOLATED_GSETTINGS_DIR="$task_proxy_dir" HELIOS_ISOLATED_PROXY_TEST=1 \
            dbus-run-session -- cargo test -p helios-daemon managed_guard_restores_lease_on_exit_and_on_startup_recovery -- --ignored
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace --release
      - name: Validate Linux client package
        run: |
          sh -n deploy/install-linux-client.sh
          sh -n deploy/package-linux-client.sh
          sh deploy/package-linux-client.sh target/release target/linux-package
          task_unpack_dir=$(mktemp -d "$RUNNER_TEMP/helios-package.XXXXXX")
          tar -xzf "target/linux-package/helios-linux-$(uname -m).tar.gz" -C "$task_unpack_dir"
          cd "$task_unpack_dir"
          sha256sum -c SHA256SUMS
          sh install-linux-client.sh . "$task_unpack_dir/install with spaces"
          desktop-file-validate "$task_unpack_dir/install with spaces/share/applications/helios-client.desktop"
          "$task_unpack_dir/install with spaces/bin/helios-daemon" version
      - name: Upload Linux workspace binaries
        uses: actions/upload-artifact@v4
        with:
          name: helios-linux
          if-no-files-found: error
          path: |
            target/release/helios-client
            target/release/helios-daemon
            target/release/helios-helper
            target/release/helios-server
            target/release/heliosctl
      - name: Upload Linux client package
        uses: actions/upload-artifact@v4
        with:
          name: helios-linux-client-package
          if-no-files-found: error
          path: target/linux-package/helios-linux-*.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p helios-daemon -p helios-client -p helios-helper -p heliosctl
      - name: Reject missing and corrupt TUN recovery records
        run: cargo test -p tproxy-config --features secure-state-file recovery_rejects_missing_or_corrupt_secure_record
      - run: cargo test -p helios-helper
      - run: cargo test -p tproxy-config --features secure-state-file recovery_record_
      - run: cargo clippy -p helios-daemon -p helios-client -p helios-helper -p heliosctl --all-targets -- -D warnings
      - name: Build workspace release binaries
        run: cargo build --workspace --release --locked
      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: helios-windows
          if-no-files-found: error
          path: |
            target/release/helios-client.exe
            target/release/helios-daemon.exe
            target/release/helios-helper.exe
            target/release/helios-server.exe
            target/release/heliosctl.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p helios-daemon -p helios-client -p helios-helper -p heliosctl
      - name: Reject missing and corrupt TUN recovery records
        run: cargo test -p tproxy-config --features secure-state-file recovery_rejects_missing_or_corrupt_secure_record
      - run: cargo test -p helios-helper
      - run: cargo test -p tproxy-config --features secure-state-file recovery_record_
      - run: cargo clippy -p helios-daemon -p helios-client -p helios-helper -p heliosctl --all-targets -- -D warnings
      - name: Build workspace release binaries
        run: cargo build --workspace --release --locked
      - name: Upload macOS binaries
        uses: actions/upload-artifact@v4
        with:
          name: helios-macos
          if-no-files-found: error
          path: |
            target/release/helios-client
            target/release/helios-daemon
            target/release/helios-helper
            target/release/helios-server
            target/release/heliosctl
