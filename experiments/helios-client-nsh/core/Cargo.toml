[package]
name = "helios-mobile-core"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
ios-ffi = []

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
helios-config = { path = "../../../crates/helios-config" }
helios-client-model = { path = "../../../crates/helios-client-model" }
helios-protocol = { path = "../../../crates/helios-protocol" }
helios-routing = { path = "../../../crates/helios-routing" }
helios-transport = { path = "../../../crates/helios-transport" }
ipstack = "1.0.1"
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.48.0", features = ["io-util", "net", "rt-multi-thread", "sync", "time", "macros"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tempfile = "3"

[dev-dependencies]
etherparse = "0.20.3"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
