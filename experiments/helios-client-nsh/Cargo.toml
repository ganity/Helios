[package]
name = "helios-client-nsh-prototype"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
exclude = ["core", "android/runner", "ios/runner"]

[dependencies]
helios-mobile-core = { path = "core" }
helios-config = { path = "../../crates/helios-config" }
helios-client-model = { path = "../../crates/helios-client-model" }
tokio = { version = "1.48.0", features = ["io-util", "net", "rt-multi-thread", "sync", "time", "macros"] }
serde_json = "1"
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "78e2f02a21c4eadfa295ae6c79bdbc9b76a40c7e" }
nsh-base = { git = "https://github.com/longbridge/nsh", rev = "78e2f02a21c4eadfa295ae6c79bdbc9b76a40c7e", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
tun = { version = "0.8.14", features = ["async"] }
