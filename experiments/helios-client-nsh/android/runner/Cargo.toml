[package]
name = "helios-android-host"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
name = "nsh"
crate-type = ["cdylib"]

[dependencies]
helios = { package = "helios-client-nsh-prototype", path = "../.." }
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "78e2f02a21c4eadfa295ae6c79bdbc9b76a40c7e" }
nsh-base = { git = "https://github.com/longbridge/nsh", rev = "78e2f02a21c4eadfa295ae6c79bdbc9b76a40c7e", default-features = false }
nsh-platform-android = { git = "https://github.com/longbridge/nsh", rev = "78e2f02a21c4eadfa295ae6c79bdbc9b76a40c7e", default-features = false }
