[package]
name = "helios-transport"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
helios-protocol = { path = "../helios-protocol" }
getrandom.workspace = true
quinn.workspace = true
rustls.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "rt", "sync", "time"] }
tokio-rustls.workspace = true
tracing.workspace = true
socket2 = { version = "0.6.5", features = ["all"] }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
