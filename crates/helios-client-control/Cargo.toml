[package]
name = "helios-client-control"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
helios-config = { path = "../helios-config" }
helios-control = { path = "../helios-control" }
helios-protocol = { path = "../helios-protocol" }
helios-routing = { path = "../helios-routing" }
helios-transport = { path = "../helios-transport" }
quinn.workspace = true
rustls.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "time"] }

[dev-dependencies]
base64 = "0.22.1"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread"] }
