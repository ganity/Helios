schema_version = 1
listen = "0.0.0.0:24443"
listen_ipv6 = "[::]:24443"

[tls]
certificate = "cert.pem"
private_key = "key.pem"

[auth]
id = "desktop-main"
token_file = "token.hex"

[limits]
handshake_timeout_seconds = 10
# TLS uses one session per browser connection; eight rejects ordinary parallel page loads.
max_sessions = 32
max_flows_per_session = 64
